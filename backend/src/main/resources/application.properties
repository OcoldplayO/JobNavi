spring.application.name=backend

# Database (non-sensitive - URL only)
spring.datasource.url=jdbc:mysql://localhost:3306/jobnavi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credentials: MUST override in application-local.properties (gitignored, never commit)
# 1. cp application-local.properties.example application-local.properties
# 2. Edit application-local.properties and fill in your MySQL username/password
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Load local overrides (application-local.properties = gitignored)
spring.profiles.active=local

# JWT (MVP)
# HS256 requires a Base64-encoded secret of at least 32 bytes.
# IMPORTANT: Do NOT put secrets in this file (it will be committed).
# Put `jobnavi.jwt.secret` into `application-local.properties` (gitignored),
# or use ENV / secret manager for production.
jobnavi.jwt.expiration-ms=86400000
